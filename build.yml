name: Build Windows EXE

on:
  workflow_dispatch:        # GitHub 화면의 [Run workflow] 버튼으로 수동 실행
  push:
    tags: ["v*"]            # v1.0 같은 태그를 올리면 자동 실행

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --onedir --windowed --name LoadingJudge loading_judge_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: LoadingJudge-win
          path: dist/LoadingJudge
